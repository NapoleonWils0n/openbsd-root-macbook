#===============================================================================
# /etc/sysctl.conf - Scaled for 4 GB RAM MacBook Air
#===============================================================================

# Keep buffer cache moderate (Default is 20%. Cap at 25% so apps have ~3 GB RAM)
kern.bufcachepercent=25

# Process and file descriptor limits scaled for 4 GB
kern.maxproc=4096
kern.maxfiles=16384

# Shared Memory (SysV SHM) limits scaled for 4 GB RAM (2 GB max SHM allocation)
# 524288 pages @ 4KB = 2 GB max total shared memory
kern.shminfo.shmall=524288
kern.shminfo.shmmax=1073741824
kern.shminfo.shmmni=1024
kern.shminfo.shmseg=1024

# Semaphores
kern.seminfo.semmns=4096
kern.seminfo.semmni=1024

# Network socket listen queue
kern.somaxconn=1024
